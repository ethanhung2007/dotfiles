# ~/.config/hypr/hyprland.conf
# Minimal dark rice — Hyprland — Tokyo Night palette

# ---- Colors ----
$bg = 1a1b26
$bg-alt = 16161e
$surface = 24283b
$fg = c0caf5
$fg-dim = a9b1d6
$accent = 7aa2f7
$border-inactive = 292e42

# ---- Monitor ----
monitor=DP-2,3840x2160@164.99,0x0,1.5

# ---- Autostart ----
exec-once = caelestia shell -d
# ags (old bar), hyprpaper, and mako are superseded by caelestia-shell, which
# has its own bar/sidebar/dashboard/launcher, wallpaper picker ("caelestia
# wallpaper set"), and notification handling (its sidebar IS the
# notification center). Running mako/hyprpaper alongside it risks a
# DBus-notification-service conflict — re-enable individually below if you
# find caelestia doesn't actually cover one of these.
# exec-once = ags run ~/.config/ags
# exec-once = hyprpaper
# exec-once = mako
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = nm-applet --indicator

# ---- Env ----
env = XCURSOR_SIZE,30
env = XCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_THEME,Bibata-Modern-Ice
env = HYPRCURSOR_SIZE,30
env = GTK_THEME,Adwaita:dark
env = ELECTRON_OZONE_PLATFORM_HINT,auto
env = QT_QPA_PLATFORMTHEME,qt5ct

# ---- Input ----
input {
    kb_layout = us
    kb_options = ctrl:nocaps
    follow_mouse = 1
    sensitivity = -0.6
    touchpad {
        natural_scroll = true
    }
}

# ---- General ----
general {
    gaps_in = 4
    gaps_out = 10
    border_size = 3
    col.active_border = rgb($accent)
    col.inactive_border = rgba($border-inactiveaa)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

# ---- Decoration ----
decoration {
    rounding = 4

    blur {
        enabled = true
        size = 3
        passes = 2
        new_optimizations = true
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 12
        render_power = 2
        color = rgba(00000066)
    }

    active_opacity = 1.0
    inactive_opacity = 0.94
}

# ---- Animations ----
animations {
    enabled = true

    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 4, overshot, slide
    animation = windowsOut, 1, 3, smoothOut, slide
    animation = border, 1, 6, default
    animation = fade, 1, 4, smoothIn
    animation = workspaces, 1, 3, smoothIn, slide
}

# ---- Layout ----
dwindle {
    preserve_split = true
}

master {
    new_status = master
}

# ---- Misc ----
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# ---- Cursor ----
cursor {
    # Fractional monitor scale + hardware cursor plane has a known bug where
    # the cursor vanishes while idle. Forcing software rendering avoids it.
    no_hardware_cursors = true
}

# ---- Gestures ----
gesture = 3, horizontal, workspace

# ---- Window rules ----
windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(kitty)$, opacity 0.95 0.9

# ---- Variables ----
$mainMod = SUPER
$terminal = kitty
$launcher = wofi --show drun
$fileManager = kitty -e yazi

# ---- Keybinds ----
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, W, killactive,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod, SPACE, exec, $launcher
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, P, pseudo,
bind = $mainMod ALT, J, layoutmsg, togglesplit
bind = $mainMod, X, exec, hyprlock

# Focus movement
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d
bind = $mainMod, H, movefocus, l
bind = $mainMod, L, movefocus, r
bind = $mainMod, K, movefocus, u
bind = $mainMod, J, movefocus, d

# Window movement
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d
bind = $mainMod SHIFT, H, movewindow, l
bind = $mainMod SHIFT, L, movewindow, r
bind = $mainMod SHIFT, K, movewindow, u
bind = $mainMod SHIFT, J, movewindow, d

# Resize active window, one axis at a time (hold to keep resizing)
binde = $mainMod CTRL, H, resizeactive, -40 0
binde = $mainMod CTRL, L, resizeactive, 40 0
binde = $mainMod CTRL, K, resizeactive, 0 -40
binde = $mainMod CTRL, J, resizeactive, 0 40

# Workspaces 1-9
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mouse binds
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media / brightness (uncomment if using laptop keys)
# bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
# bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
# bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
