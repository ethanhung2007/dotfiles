# ~/.config/hypr/hyprland.conf
# Minimal dark rice — Hyprland

# ---- Colors ----
$bg = 0f1013
$bg-alt = 17181c
$surface = 1e1f24
$fg = c8c9d0
$fg-dim = 75767f
$accent = 8fa3b3
$border-inactive = 2a2b30

# ---- Monitor ----
# Adjust to your actual output name/resolution once on your PC (run `hyprctl monitors`)
monitor=,preferred,auto,1

# ---- Autostart ----
exec-once = ags run ~/.config/ags
exec-once = hyprpaper
exec-once = mako
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = nm-applet --indicator

# ---- Env ----
env = XCURSOR_SIZE,20
env = QT_QPA_PLATFORMTHEME,qt5ct

# ---- Input ----
input {
    kb_layout = us
    follow_mouse = 1
    sensitivity = 0
    touchpad {
        natural_scroll = true
    }
}

# ---- General ----
general {
    gaps_in = 4
    gaps_out = 10
    border_size = 1
    col.active_border = rgb($accent)
    col.inactive_border = rgba($border-inactive aa)
    layout = dwindle
    resize_on_border = true
    allow_tearing = false
}

# ---- Decoration ----
decoration {
    rounding = 4

    blur {
        enabled = true
        size = 3
        passes = 2
        new_optimizations = true
        ignore_opacity = true
    }

    shadow {
        enabled = true
        range = 12
        render_power = 2
        color = rgba(00000066)
    }

    active_opacity = 1.0
    inactive_opacity = 0.94
}

# ---- Animations ----
animations {
    enabled = true

    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 4, overshot, slide
    animation = windowsOut, 1, 3, smoothOut, slide
    animation = border, 1, 6, default
    animation = fade, 1, 4, smoothIn
    animation = workspaces, 1, 3, smoothIn, slide
}

# ---- Layout ----
dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

# ---- Misc ----
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    mouse_move_enables_dpms = true
    key_press_enables_dpms = true
}

# ---- Gestures ----
gestures {
    workspace_swipe = true
}

# ---- Window rules ----
windowrulev2 = float,class:^(pavucontrol)$
windowrulev2 = float,class:^(nm-connection-editor)$
windowrulev2 = opacity 0.95 0.9,class:^(kitty)$

# ---- Variables ----
$mainMod = SUPER
$terminal = kitty
$launcher = wofi --show drun
$fileManager = kitty -e yazi

# ---- Keybinds ----
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, Q, killactive,
bind = $mainMod SHIFT, Q, exit,
bind = $mainMod, D, exec, $launcher
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen,
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,
bind = $mainMod, L, exec, hyprlock

# Focus movement
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# Window movement
bind = $mainMod SHIFT, left,  movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up,    movewindow, u
bind = $mainMod SHIFT, down,  movewindow, d

# Workspaces 1-9
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Mouse binds
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Media / brightness (uncomment if using laptop keys)
# bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
# bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
# bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
