# ~/.config/hypr/hyprpaper.conf
# Point this at a solid dark/minimal wallpaper once you have one picked out.
# A plain #1a1b26 or subtle-gradient/noise-texture image works best with this theme.

preload = ~/.config/hypr/wallpapers/wall.png
wallpaper = ,~/.config/hypr/wallpapers/wall.png
splash = false
ipc = on
