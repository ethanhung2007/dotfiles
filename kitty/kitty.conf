# ~/.config/kitty/kitty.conf

# ---- Font ----
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0

# ---- Window ----
window_padding_width 12
hide_window_decorations yes
background_opacity 0.94
confirm_os_window_close 0

# ---- Tab bar (minimal, only shows when >1 tab) ----
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2

# ---- Cursor ----
cursor_shape beam
cursor_blink_interval 0

# ---- Scrollback ----
scrollback_lines 10000

# ---- Colors: minimal dark ----
background            #0f1013
foreground             #c8c9d0
selection_background   #2a2b30
selection_foreground   #c8c9d0
cursor                 #8fa3b3
cursor_text_color      #0f1013

url_color #8fa3b3

# black
color0  #17181c
color8  #4a4b52
# red
color1  #a3717a
color9  #b3808f
# green
color2  #8fa896
color10 #9fbca6
# yellow
color3  #b3a08f
color11 #c4b19d
# blue
color4  #7d95a8
color12 #8fa3b3
# magenta
color5  #a087a3
color13 #b096b3
# cyan
color6  #7fa3a3
color14 #8fb8b8
# white
color7  #c8c9d0
color15 #e4e5ea

# ---- Misc ----
enable_audio_bell no
allow_remote_control yes
shell_integration enabled
