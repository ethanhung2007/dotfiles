# ~/.config/kitty/kitty.conf

# ---- Font ----
font_family      monospace
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 12.0

# ---- Window ----
window_padding_width 12
hide_window_decorations yes
background_opacity 0.94
confirm_os_window_close 0

# ---- Tab bar (minimal, only shows when >1 tab) ----
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 2

# ---- Cursor ----
cursor_shape beam
cursor_blink_interval 0

# ---- Scrollback ----
scrollback_lines 10000

# ---- Colors: Tokyo Night ----
background            #1a1b26
foreground             #c0caf5
selection_background   #283457
selection_foreground   #c0caf5
cursor                 #c0caf5
cursor_text_color      #1a1b26

url_color #73daca

# black
color0  #15161e
color8  #414868
# red
color1  #f7768e
color9  #f7768e
# green
color2  #9ece6a
color10 #9ece6a
# yellow
color3  #e0af68
color11 #e0af68
# blue
color4  #7aa2f7
color12 #7aa2f7
# magenta
color5  #bb9af7
color13 #bb9af7
# cyan
color6  #7dcfff
color14 #7dcfff
# white
color7  #a9b1d6
color15 #c0caf5

# ---- Misc ----
enable_audio_bell no
allow_remote_control yes
shell_integration enabled
